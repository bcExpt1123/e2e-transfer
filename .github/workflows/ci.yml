name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm deps:check
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm size
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

  e2e:
    needs: check
    # Playwright's WebKit has WebRTC on macOS but not on Linux. The WebKit transfer tests are skipped
    # on CI (tests/e2e/transfer.spec.ts); the app-shell and PWA tests still run there.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browsers: chromium firefox
            projects: --project=chromium --project=mobile --project=firefox
          - os: macos-latest
            browsers: webkit
            projects: --project=webkit
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps ${{ matrix.browsers }}
      # Firefox gathers no ICE candidates at all on a machine without an IPv6 route. Without camera
      # permission it uses only the "default" address, and it gives up if the IPv6 probe for that
      # address fails. A private IPv6 route on a dummy interface lets the probe succeed; nothing is sent over it.
      - name: Add an IPv6 route for Firefox WebRTC
        if: runner.os == 'Linux'
        run: |
          if ! ip -6 route show default | grep -q .; then
            sudo sysctl -qw net.ipv6.conf.all.disable_ipv6=0 net.ipv6.conf.default.disable_ipv6=0
            sudo ip link add e2e0 type dummy
            sudo ip link set e2e0 up
            sudo ip -6 addr add fd00:e2e::1/64 dev e2e0 nodad
            sudo ip -6 route add default via fd00:e2e::2 dev e2e0 metric 2048
          fi
          ip -6 route
      - run: pnpm test:e2e ${{ matrix.projects }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report

  # Firebase Hosting (firebase.json). Needs the repository secret FIREBASE_SERVICE_ACCOUNT_TRANSFER_E2E
  # (docs/DEPLOY.md). main → live site; pull requests from this repo → a 7-day preview channel.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://transfer-e2e.web.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANSFER_E2E }}
          projectId: transfer-e2e
          channelId: live

  preview:
    # Secrets aren't available to pull requests from forks.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANSFER_E2E }}
          projectId: transfer-e2e
          expires: 7d
